name: build

on:
  push:
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libasound2-dev libx11-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxext-dev libfreetype-dev libfontconfig1-dev libgl1-mesa-dev
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build
      - name: Test
        run: cd build && ctest --output-on-failure
      - uses: actions/upload-artifact@v4
        with:
          name: freqfreaks-linux
          path: |
            build/plugins/FreqFreaksTrack_artefacts/Release/VST3
            build/plugins/FreqFreaksHub_artefacts/Release/VST3
            build/plugins/FreqFreaksTrack_artefacts/Release/LV2
            build/plugins/FreqFreaksHub_artefacts/Release/LV2
