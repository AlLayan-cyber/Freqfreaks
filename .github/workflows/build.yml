name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-24.04
            configure: -G Ninja -DCMAKE_BUILD_TYPE=Release
          - name: macos
            os: macos-latest
            configure: -G Ninja -DCMAKE_BUILD_TYPE=Release "-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64"
          - name: windows
            os: windows-2022
            configure: -G "Visual Studio 17 2022" -A x64

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libasound2-dev libx11-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxext-dev libfreetype-dev libfontconfig1-dev libgl1-mesa-dev

      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Configure
        run: cmake -S . -B build ${{ matrix.configure }}

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Test
        working-directory: build
        run: ctest -C Release -V

      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          for p in Track Hub; do
            art="build/plugins/FreqFreaks${p}_artefacts/Release"
            for fmt in VST3 AU LV2; do
              [ -d "$art/$fmt" ] && cp -R "$art/$fmt/." "dist/" || true
            done
            [ -d "$art/Standalone" ] && mkdir -p dist/Standalone && cp -R "$art/Standalone/." dist/Standalone/ || true
          done
          rm -f dist/*.exp dist/*.lib   # MSVC import libraries, not needed by hosts
          cp LICENSE dist/LICENSE.txt   # GPLv3: the licence travels with the plug-ins
          cp docs/FreqFreaks-manual-ru.pdf "dist/FreqFreaks - руководство.pdf"
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: FreqFreaks-${{ matrix.name }}
          path: dist
